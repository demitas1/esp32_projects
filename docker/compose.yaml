services:
  esp-idf:
    image: espressif/idf
    container_name: esp32_container
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /projects
    environment:
      - TZ=Asia/Tokyo
      - HOME=/tmp
    volumes:
      - ../projects:/projects
      - /dev:/dev
    user: "${UID:-1000}"

  esp-idf-rust:
    image: espressif/idf-rust:esp32_latest
    container_name: esp32_rust_container
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /projects
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ../projects:/projects
      - /dev:/dev
    user: "${UID:-1000}"

  esp32-pio:
    build:
      context: ./pio
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: esp32-pio:latest
    container_name: esp32_pio_container
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /projects
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ../projects:/projects
      - /dev:/dev
      - pio-core:/opt/platformio   # toolchains and libraries survive container rebuilds
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - dialout

volumes:
  pio-core:
