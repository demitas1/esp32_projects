; M5Stack StickS3 firmware (ESP32-S3-PICO-1-N8R8)
; One PlatformIO project, one env per app. Shared code lives in lib/.

[platformio]
default_envs = bringup

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
; Auto-reset works while firmware built here (USB-Serial/JTAG) is running.
; From UiFlow2 or a crashed app, enter download mode manually (see README) and
; single-press the power button after upload.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Hardware check: display, buttons, IMU, speaker, microphone
[env:bringup]
build_src_filter = +<bringup/>
